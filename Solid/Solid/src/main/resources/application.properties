spring.application.name=Solid

# --- DATABASE CONFIGURATION ---
# We use variables here so you can swap 'localhost' for the real cloud DB URL later
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Keep 'update' for now, but be careful in production (it modifies table structure)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- SERVER PORT ---
# This tells the app: "Use the host's port ($PORT), but if not found, use 9090"
server.port=${PORT:9090}

# --- SECURITY ---
jwt.secret-key=${JWT_SECRET}
management.endpoints.web.exposure.include=mappings

# --- EMAIL (BREVO API) ---
# Using Brevo API instead of SMTP (works on Railway)
brevo.api.key=${BREVO_API_KEY}
spring.mail.from=mail@soliddesign.fit

# Legacy SMTP config removed to avoid SMTP delivery attempts. Email now sends via Brevo REST API only.

# --- PERFORMANCE & CACHING ---
# Enable gzip compression for API responses
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

# Connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Response timeout for image loading
server.tomcat.connection-timeout=30000ms
server.tomcat.keep-alive-timeout=30000ms