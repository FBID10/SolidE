spring.application.name=Solid

# --- DATABASE CONFIGURATION ---
# We use variables here so you can swap 'localhost' for the real cloud DB URL later
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Keep 'update' for now, but be careful in production (it modifies table structure)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- SERVER PORT ---
# This tells the app: "Use the host's port ($PORT), but if not found, use 9090"
server.port=${PORT:9090}

# --- SECURITY ---
jwt.secret-key=${JWT_SECRET}
management.endpoints.web.exposure.include=mappings

# --- EMAIL (BREVO) ---
# NOTE: Railway may block outbound SMTP port 587. If emails fail, consider using Brevo API instead.
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=9a0db5001@smtp-brevo.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.from=mail@soliddesign.fit
spring.mail.from=mail@soliddesign.fit
spring.mail.properties.mail.debug=false

# --- PERFORMANCE & CACHING ---
# Enable gzip compression for API responses
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

# Connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Response timeout for image loading
server.tomcat.connection-timeout=30000ms
server.tomcat.keep-alive-timeout=30000ms