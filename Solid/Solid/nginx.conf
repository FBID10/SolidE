# Nginx is serving the static React build and acting as a reverse proxy.

server {
    # Nginx listens on port 80 (standard HTTP port)
    listen 80;

    # Set the root directory to serve static files (your React build)
    # The React files are mounted inside the container at /usr/share/nginx/html
    root /usr/share/nginx/html;

    # Index file when accessing the root URL
    index index.html;

    # Configuration to handle your single-page application (SPA)
    # This ensures that any deep link (like /products/123) is routed back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuration for your Spring Boot API endpoints
    # All requests starting with /api/ will be proxied to the Spring Boot container
    location /api/ {
        # 'backend' is the service name defined in docker-compose.yml
        proxy_pass http://backend:9090;

        # Standard headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
